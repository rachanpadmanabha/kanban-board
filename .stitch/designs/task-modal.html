<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Glacial Horizon - Task Editor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary": "#472a00",
              "on-surface": "#dae2fd",
              "tertiary-container": "#f1a02b",
              "on-secondary-fixed": "#000767",
              "surface-container": "#171f33",
              "on-surface-variant": "#bdc8d1",
              "background": "#0b1326",
              "tertiary": "#ffc176",
              "surface-container-highest": "#2d3449",
              "inverse-primary": "#00668a",
              "primary-container": "#38bdf8",
              "surface-variant": "#2d3449",
              "on-tertiary-fixed": "#2a1700",
              "surface-container-lowest": "#060e20",
              "surface-tint": "#7bd0ff",
              "secondary-fixed-dim": "#bdc2ff",
              "tertiary-fixed-dim": "#ffb960",
              "on-secondary-container": "#a8afff",
              "on-primary": "#00354a",
              "on-primary-fixed": "#001e2c",
              "on-error-container": "#ffdad6",
              "inverse-surface": "#dae2fd",
              "error-container": "#93000a",
              "secondary": "#bdc2ff",
              "on-primary-container": "#004965",
              "primary": "#8ed5ff",
              "on-primary-fixed-variant": "#004c69",
              "surface-container-high": "#222a3d",
              "surface-dim": "#0b1326",
              "on-error": "#690005",
              "on-tertiary-container": "#613b00",
              "error": "#ffb4ab",
              "on-secondary": "#131e8c",
              "on-background": "#dae2fd",
              "inverse-on-surface": "#283044",
              "surface-bright": "#31394d",
              "surface": "#0b1326",
              "primary-fixed": "#c4e7ff",
              "tertiary-fixed": "#ffddb8",
              "outline-variant": "#3e484f",
              "outline": "#87929a",
              "surface-container-low": "#131b2e",
              "secondary-fixed": "#e0e0ff",
              "on-secondary-fixed-variant": "#2f3aa3",
              "on-tertiary-fixed-variant": "#653e00",
              "secondary-container": "#2f3aa3",
              "primary-fixed-dim": "#7bd0ff"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .glass-pane {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .arctic-gradient {
            background: linear-gradient(135deg, #8ed5ff 0%, #38bdf8 100%);
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d3449;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body overflow-hidden selection:bg-primary-container/30">
<!-- Backboard Emulation (Blurred Content Behind) -->
<div class="fixed inset-0 z-0 p-8 flex flex-col gap-8 opacity-40 blur-md pointer-events-none">
<header class="flex justify-between items-center h-16 px-8">
<div class="text-2xl font-black tracking-tighter text-white">Glacial Horizon</div>
<div class="flex gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-highest"></div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest"></div>
</div>
</header>
<div class="grid grid-cols-4 gap-6 h-full">
<div class="bg-surface-container rounded-xl p-4 flex flex-col gap-4">
<div class="h-6 w-24 bg-surface-variant rounded"></div>
<div class="h-32 bg-surface-variant/50 rounded-xl"></div>
<div class="h-32 bg-surface-variant/50 rounded-xl"></div>
</div>
<div class="bg-surface-container rounded-xl p-4 flex flex-col gap-4 border border-primary-container/20">
<div class="h-6 w-24 bg-surface-variant rounded"></div>
<div class="h-40 bg-surface-variant rounded-xl"></div>
<div class="h-32 bg-surface-variant/50 rounded-xl"></div>
</div>
<div class="bg-surface-container rounded-xl p-4 flex flex-col gap-4">
<div class="h-6 w-24 bg-surface-variant rounded"></div>
<div class="h-24 bg-surface-variant/50 rounded-xl"></div>
</div>
<div class="bg-surface-container rounded-xl p-4 flex flex-col gap-4">
<div class="h-6 w-24 bg-surface-variant rounded"></div>
<div class="h-32 bg-surface-variant/50 rounded-xl"></div>
</div>
</div>
</div>
<!-- Scrim / Overlay -->
<div class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
<!-- Task Modal -->
<div class="glass-pane w-full max-w-[520px] rounded-xl shadow-2xl flex flex-col overflow-hidden">
<!-- Modal Header -->
<div class="px-6 py-5 flex items-center justify-between">
<h2 class="text-xl font-semibold text-white tracking-tight">Edit Task</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors group">
<span class="material-symbols-outlined text-outline group-hover:text-white" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="px-6 py-2 overflow-y-auto max-h-[716px] flex flex-col gap-6">
<!-- Title Input -->
<div class="flex flex-col gap-2">
<label class="text-xs font-bold uppercase tracking-widest text-slate-400 font-label">Title</label>
<input class="w-full bg-surface-container-lowest/50 border-b border-white/10 text-white px-0 py-2 focus:ring-0 focus:border-primary transition-all placeholder:text-slate-600 outline-none" type="text" value="Implement Arctic API Middleware"/>
</div>
<!-- Description Input -->
<div class="flex flex-col gap-2">
<label class="text-xs font-bold uppercase tracking-widest text-slate-400 font-label">Description</label>
<textarea class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-lg text-on-surface p-3 focus:ring-1 focus:ring-primary/50 focus:border-primary transition-all resize-none text-sm leading-relaxed outline-none" rows="4">Refactor the current request/response cycle to handle glacial density headers and implement the sub-zero caching strategy for Q4 roadmap milestones. Ensure the backdrop-blur values are passed as metadata.</textarea>
</div>
<!-- Priority Selector -->
<div class="flex flex-col gap-3">
<label class="text-xs font-bold uppercase tracking-widest text-slate-400 font-label">Priority</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-1.5 rounded-full text-xs font-medium border border-white/5 bg-white/5 text-slate-400 hover:bg-white/10 transition-all">Low</button>
<button class="px-4 py-1.5 rounded-full text-xs font-medium border border-white/5 bg-white/5 text-slate-400 hover:bg-white/10 transition-all">Medium</button>
<button class="px-4 py-1.5 rounded-full text-xs font-medium border border-primary/40 bg-primary/10 text-primary">High</button>
<button class="px-4 py-1.5 rounded-full text-xs font-medium border border-white/5 bg-white/5 text-slate-400 hover:bg-white/10 transition-all">Urgent</button>
</div>
</div>
<div class="grid grid-cols-2 gap-6">
<!-- Tags -->
<div class="flex flex-col gap-3">
<label class="text-xs font-bold uppercase tracking-widest text-slate-400 font-label">Tags</label>
<div class="flex flex-wrap gap-2">
<span class="px-3 py-1 rounded-full bg-secondary-container/40 text-secondary text-[11px] font-bold tracking-tight">DESIGN</span>
<span class="px-3 py-1 rounded-full bg-secondary-container/40 text-secondary text-[11px] font-bold tracking-tight">FRONTEND</span>
<button class="w-7 h-7 flex items-center justify-center rounded-full bg-white/5 text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Status Dropdown -->
<div class="flex flex-col gap-2">
<label class="text-xs font-bold uppercase tracking-widest text-slate-400 font-label">Status</label>
<div class="relative group">
<div class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm flex items-center justify-between cursor-pointer hover:bg-white/10 transition-all">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(56,189,248,0.5)]"></div>
<span class="text-white">In Progress</span>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-white text-sm" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Spacer -->
<div class="h-4"></div>
</div>
<!-- Modal Footer -->
<div class="p-6 border-t border-white/5 bg-black/20 flex items-center justify-between">
<button class="text-xs font-bold uppercase tracking-widest text-error/60 hover:text-error transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="delete">delete</span>
                    Delete Task
                </button>
<div class="flex items-center gap-4">
<button class="px-5 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-all">Cancel</button>
<button class="arctic-gradient px-6 py-2 rounded-lg text-sm font-bold text-on-primary-container shadow-lg shadow-primary-container/20 hover:scale-[1.02] active:scale-95 transition-all">
                        Save Changes
                    </button>
</div>
</div>
</div>
</div>
<!-- Background Atmospheric Glows -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 blur-[120px] rounded-full z-[-1] pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-secondary-container/10 blur-[100px] rounded-full z-[-1] pointer-events-none"></div>
</body></html>
